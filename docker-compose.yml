# Local dev dependencies for BeautyAI. Optional: only needed when the API
# runs in "async mode" (REDIS_URL set) or you prefer Postgres in Docker.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beautyai
      POSTGRES_PASSWORD: beautyai_dev
      POSTGRES_DB: beautyai
    ports:
      - "5432:5432"
    volumes:
      - beautyai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - beautyai_redisdata:/data

volumes:
  beautyai_pgdata:
  beautyai_redisdata: